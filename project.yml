name: Trend
options:
  bundleIdPrefix: com.3DaysOfSwiftConcurrency
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: PLPUN94HL2
    CODE_SIGN_STYLE: Automatic
fileGroups:
  - StoreKit Configuration
targets:
  Trend:
    type: application
    attributes:
      SystemCapabilities:
        com.apple.iCloud:
          enabled: 1
        com.apple.BackgroundModes:
          enabled: 1
        com.apple.Push:
          enabled: 1
    platform: iOS
    sources:
      - path: Trend
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.3DaysOfSwiftConcurrency.Trend
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_ENTITLEMENTS: Trend/3 - App Resources/Trend.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Configuration/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Trend
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - TrendTests
  TrendTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TrendTests
    dependencies:
      - target: Trend
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.3DaysOfSwiftConcurrency.TrendTests
        GENERATE_INFOPLIST_FILE: YES
